services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m fixtures.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata: